name: Setup web
description: pnpm, node, and a frozen-lockfile install for the web app

runs:
  using: composite
  steps:
    # working-directory below applies to run steps only, so this action needs
    # the path to web/package.json spelled out to find the packageManager pin
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    # fails on lockfile drift rather than silently resolving something else
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
